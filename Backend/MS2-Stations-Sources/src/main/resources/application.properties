spring.application.name=MS2-Stations-Sources
server.port=8082

# base h2 en mode fichier, le fichier est cree dans le dossier data du projet
spring.datasource.url=jdbc:h2:file:./data/sources_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# hibernate cree les tables a partir des entites et affiche le sql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# console h2 sur http://localhost:8082/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
